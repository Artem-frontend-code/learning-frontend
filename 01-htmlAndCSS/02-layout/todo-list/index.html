<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Недельный план</title>
    </head>
    <body>
        <header>
            <h1>Недельный план</h1>
        </header>
        <main>
            <section class="toDoList">
            <h2>Список задач</h2>
            <ul class="todo-list">
                <li class="todo-item">
                    <label class="todo-checkbox-label">
                        <input type="checkbox" class="todo-checkbox">
                        <span class="custom-checkbox"></span>
                    </label>
                    <span class="todo-text">Купить молоко</span>
                    <button type="button" class="delete-task">&#x2717;</button>
                </li>
            </ul>
            </section>

            <section class="shedule">
                <h2>Расписание</h2>
                <ul class="shedule-list">
                    <li class="shedule-list-item">
                        <h3>Понедельник</h3>
                    </li>
                    <li class="shedule-list-item">
                        <h3>Вторник</h3>
                    </li>
                    <li class="shedule-list-item">
                        <h3>Среда</h3>
                    </li>
                    <li class="shedule-list-item">
                        <h3>Четверг</h3>
                    </li>
                    <li class="shedule-list-item">
                        <h3>Пятница</h3>
                    </li>
                    <li class="shedule-list-item">
                        <h3>Суббота</h3>
                    </li>
                    <li class="shedule-list-item">
                        <h3>Воскресенье</h3>
                    </li>
                </ul>
            </section>

            <section class="note">
                <h2>Заметки</h2>
            </section>
        </main>
    </body>
</html>
